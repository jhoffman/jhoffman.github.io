<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
	{% if page.title  == "Home" %}
		<title> {{ site.title }} | Associate Professor - UC Irvine </title>
	{% else %}
		<title>{{ page.title }} - {{ site.title }}</title>
	{% endif %}
	
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">

  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="icon" href="{{ '/favicon-32.png' | relative_url }}" type="image/png" sizes="32x32">
  <link rel="icon" href="{{ '/favicon-16.png' | relative_url }}" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">

  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
	  <link rel="stylesheet" href="{{ '/css/header.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/pub_style.css' | relative_url }}">
	
	<meta name="google-site-verification" content="Wdstg584QiZaJPspoFplnoLEpMBeRXfUvPUuZx27N2E" />
</head>
<body>
  <header>
		<div class="header-bar">
			<div class="header-title">
				<h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
			</div>
			<button class="nav-toggle" onclick="toggleNav(this)" aria-label="Menu" aria-expanded="false" aria-controls="navbar">☰</button>
    <nav class="navbar" id="navbar">
      <ul class="nav-list">
        <li><a href="{{ '/' | relative_url }}" {% if page.url == "/" %}class="active"{% endif %}>Home</a></li>
        <li><a href="{{ '/lab/' | relative_url }}" {% if page.url == "/lab/" %}class="active"{% endif %}>Lab</a></li>
        <li><a href="{{ '/publications/' | relative_url }}" {% if page.url == "/publications/" %}class="active"{% endif %}>Publications</a></li>
        <li><a href="{{ '/news/' | relative_url }}" {% if page.url == "/news/" %}class="active"{% endif %}>News</a></li>
        <li><a href="{{ '/teaching/' | relative_url }}" {% if page.url == "/teaching/" %}class="active"{% endif %}>Teaching</a></li>
				<li><a href="{{ '/about/' | relative_url }}" {% if page.url == "/about/" %}class="active"{% endif %}>About</a></li>
      </ul>
    </nav>
	</div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <p>&copy; {{ site.time | date: "%Y" }} {{ site.title }}</p>
  </footer>

<script>
  function toggleBibtex(button) {
    const bib = button.parentElement.querySelector('.bibtex-block');
    if (bib) {
      bib.style.display = (bib.style.display === 'none' || !bib.style.display) ? 'block' : 'none';
    }
  }
	
  function toggleNav(button) {
    const isOpen = document.querySelector('.navbar').classList.toggle('open');
    button.setAttribute('aria-expanded', isOpen);
  }
</script>
